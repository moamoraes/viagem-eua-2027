<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Página protegida</title>
<style>
  :root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--muted:#5d6577;--line:#e3dfd6;--accent:#d9582b}
  @media (prefers-color-scheme:dark){:root{--bg:#14171e;--card:#1d2129;--ink:#eef0f4;--muted:#a3aabb;--line:#2c313c}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(360px,90vw)}
  h1{font-size:1.2rem;margin:0 0 6px}
  p{color:var(--muted);margin:0 0 16px;font-size:.95rem}
  input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:1rem;background:var(--bg);color:var(--ink)}
  button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  label.rem{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--muted);font-size:.9rem}
  .err{color:#c0392b;min-height:1.2em;margin-top:10px;font-size:.9rem}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Página protegida</h1>
  <p>Digite a senha para continuar.</p>
  <input id="pw" type="password" placeholder="Senha" autofocus required>
  <label class="rem"><input id="rem" type="checkbox"> Lembrar neste dispositivo</label>
  <button id="btn" type="submit">Abrir</button>
  <div class="err" id="err"></div>
</form>

  var KEY = "pagina-protegida-chave";
  function u8(b){ return Uint8Array.from(atob(b), function(c){ return c.charCodeAt(0); }); }
  function show(html){ document.open(); document.write(html); document.close(); }
  async function decryptWithRaw(raw){
    var key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:u8(DATA.iv) }, key, u8(DATA.ct));
    return new TextDecoder().decode(pt);
  }
  async function deriveRaw(pw){
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({ name:"PBKDF2", salt:u8(DATA.salt), iterations:DATA.iter, hash:"SHA-256" }, base, 256));
  }
  // chave lembrada (derivada, nunca a senha em texto)
  try {
    var saved = localStorage.getItem(KEY);
    if (saved) {
      decryptWithRaw(u8(saved)).then(show).catch(function(){ try{ localStorage.removeItem(KEY); }catch(e){} });
    }
  } catch(e) {}
  document.getElementById("f").addEventListener("submit", async function(ev){
    ev.preventDefault();
    var btn = document.getElementById("btn"), err = document.getElementById("err");
    btn.disabled = true; err.textContent = "";
    try {
      var raw = await deriveRaw(document.getElementById("pw").value);
      var html = await decryptWithRaw(raw);
      if (document.getElementById("rem").checked) {
        try { localStorage.setItem(KEY, btoa(String.fromCharCode.apply(null, raw))); } catch(e) {}

      show(html);
    } catch(e) {
      err.textContent = "Senha incorreta.";
      btn.disabled = false;
